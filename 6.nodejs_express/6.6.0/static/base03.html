<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List JSON</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h1>User List</h1>
    <div id="userContainer"></div>

    <script>
        // ページロード時に /api/users からJSONデータを取得して一覧表示
        fetch('http://localhost:3000/api/users')
            .then(response => response.json())
            .then(users => {
                // DOM要素を作成してテーブルを構築
                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const tbody = document.createElement('tbody');

                // ヘッダー行を作成
                const headerRow = document.createElement('tr');
                const idHeader = document.createElement('th');
                idHeader.textContent = 'ID';
                const nameHeader = document.createElement('th');
                nameHeader.textContent = 'Name';
                headerRow.appendChild(idHeader);
                headerRow.appendChild(nameHeader);
                thead.appendChild(headerRow);

                // ユーザー行を作成
                users.forEach(user => {
                    const row = document.createElement('tr');
                    const idCell = document.createElement('td');
                    idCell.textContent = user.id;
                    const nameCell = document.createElement('td');
                    nameCell.textContent = user.name;
                    row.appendChild(idCell);
                    row.appendChild(nameCell);
                    tbody.appendChild(row);
                });

                // テーブルに要素を追加
                table.appendChild(thead);
                table.appendChild(tbody);
                document.getElementById('userContainer').appendChild(table);
            })
            .catch(error => {
                console.error('Error fetching users:', error);
                const errorMsg = document.createElement('p');
                errorMsg.textContent = 'ユーザー一覧の取得に失敗しました';
                document.getElementById('userContainer').appendChild(errorMsg);
            });
    </script>
</body>
</html>
