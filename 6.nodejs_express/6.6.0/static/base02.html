<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List JSON</title>
</head>
<body>
    <h1>User List</h1>
    <div id="userContainer"></div>

    <script>
        // ページロード時に /api/users からJSONデータを取得して一覧表示
        fetch('http://localhost:3000/api/users')
            .then(response => response.json())
            .then(users => {
                // JSONを受け取ってテーブル形式で表示
                let html = '<table><thead><tr><th>ID</th><th>Name</th></tr></thead><tbody>';
                users.forEach(user => {
                    html += `<tr><td>${user.id}</td><td>${user.name}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('userContainer').innerHTML = html;
            })
            .catch(error => {
                console.error('Error fetching users:', error);
                document.getElementById('userContainer').innerHTML = '<p>ユーザー一覧の取得に失敗しました</p>';
            });
    </script>
</body>
</html>
