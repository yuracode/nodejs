<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>CORS Demo</title></head>
<body>
  <h1>CORS デモ</h1>
  <button onclick="fetchData()">APIを叩く</button>
  <p id="result"></p>

  <script>
    async function fetchData() {
      try {
        const res = await fetch('http://localhost:4000/api/hello');
        const data = await res.json();
        document.getElementById('result').textContent = data.message;
      } catch (e) {
        document.getElementById('result').textContent = 'エラー: ' + e.message;
      }
    }
  </script>
</body>
</html>
