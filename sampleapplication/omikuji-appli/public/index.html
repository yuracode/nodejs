<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみくじアプリ</title>
</head>
<body>
    <h1>おみくじアプリ</h1>
    <button onclick="getOmikuji()">おみくじを引く</button>
    <p id="result"></p>

    <script>
        async function getOmikuji() {
            const res = await fetch('http://localhost:3000/api/omikuji',{
                method: 'GET',
                // headers: {
                //     'Content-Type': 'application/json'
                // },
                // body: JSON.stringify({name: 'hoge'}) // JSON.stringify({name: 'hoge'})のように文字列化する必要があります。
            });
            const data = await res.json();
            // document.getElementById('result').textContent = data.name + ':' + data.result;
            document.getElementById('result').textContent = data.result;
        }
        //thenを使う場合
        // function getOmikuji() {
        //     fetch('http://localhost:3000/api/omikuji')
        //         .then(res => res.json())  
        //         .then(data => {
        //             document.getElementById('result').textContent = data.result;
        //         });
        // }
    </script>
</body>
</html>
