<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>漢字クイズ</title>
</head>
<body>
  <h1>漢字読みクイズ</h1>

  <div id="quiz">
    <p id="progress"></p>
    <h2 id="question"></h2>
    <div id="choices"></div>
    <p id="result"></p>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none">次の問題</button>
  </div>

  <div id="finish" style="display:none">
    <h2>終了！</h2>
    <p id="score"></p>
    <button onclick="restart()">もう一度</button>
  </div>

  <script>
    let questions = [];
    let current = 0;
    let score = 0;

    async function loadQuestions() {
      const res = await fetch('http://localhost:3000/api/questions');
      questions = await res.json();
      showQuestion();
    }

    function showQuestion() {
      const q = questions[current];
      document.getElementById('progress').textContent = `${current + 1} / ${questions.length}`;
      document.getElementById('question').textContent = q.question;
      document.getElementById('result').textContent = '';
      document.getElementById('nextBtn').style.display = 'none';

      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(choice);
        choicesDiv.appendChild(btn);
      });
    }

    function checkAnswer(choice) {
      const q = questions[current];
      const result = document.getElementById('result');

      // 全ボタン無効化
      document.querySelectorAll('#choices button').forEach(b => b.disabled = true);

      if (choice === q.answer) {
        result.textContent = '正解！';
        score++;
      } else {
        result.textContent = `不正解です。正解は「${q.answer}」`;
      }

      document.getElementById('nextBtn').style.display = 'inline';
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('finish').style.display = 'block';
        document.getElementById('score').textContent = `${questions.length}問中 ${score}問正解！`;
      }
    }

    function restart() {
      current = 0;
      score = 0;
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('finish').style.display = 'none';
      showQuestion();
    }

    loadQuestions();
  </script>
</body>
</html>
