<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>漢字クイズ</title>
</head>

<body>
    <h1>漢字読みクイズ</h1>

    <div id="quiz">
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="choices"></div>
        <p id="result"></p>
        <button id="nextBtn" onclick="nextQuestion()" style="display:none">次の問題</button>
    </div>

    <div id="finish" style="display:none">
        <h2>終了！</h2>
        <p id="score"></p>
        <button onclick="restart()">もう一度</button>
    </div>

    <script>
        let current = 1; // インデックスではなくIDで管理
        let total = 10;  // 問題数は固定か、別APIで取得
        let score = 0;

        async function showQuestion() {
            const res = await fetch(`http://localhost:3000/api/questions?id=${current}`);

            if (res.status === 404) {
                // 問題が見つからない＝全問終了として扱う
                document.getElementById('quiz').style.display = 'none';
                document.getElementById('finish').style.display = 'block';
                document.getElementById('score').textContent = `${current - 1}問中 ${score}問正解！`;
                return;
            }

            const q = await res.json();

            document.getElementById('progress').textContent = `${current} / ${total}`;
            document.getElementById('question').textContent = q.question;
            document.getElementById('result').textContent = '';
            document.getElementById('nextBtn').style.display = 'none';

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            q.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice;
                btn.onclick = () => checkAnswer(choice, q.answer);
                choicesDiv.appendChild(btn);
            });
        }

        function checkAnswer(choice, answer) {
            const result = document.getElementById('result');
            document.querySelectorAll('#choices button').forEach(b => b.disabled = true);

            if (choice === answer) {
                result.textContent = '正解！';
                score++;
            } else {
                result.textContent = `不正解です。正解は「${answer}」`;
            }
            document.getElementById('nextBtn').style.display = 'inline';
        }

        function nextQuestion() {
            current++;
            showQuestion();
        }

        function restart() {
            current = 1;
            score = 0;
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('finish').style.display = 'none';
            showQuestion();
        }

        showQuestion(); // loadQuestionsの代わりに直接呼ぶ
    </script>
</body>

</html>
